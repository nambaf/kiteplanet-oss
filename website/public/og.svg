<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e6"/>
      <stop offset="100%" stop-color="#ece6d6"/>
    </linearGradient>
  </defs>

  <!-- Paper background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Decorative globe-ish glow bottom-right (wind blue + warm), kept off the text -->
  <circle cx="1230" cy="640" r="280" fill="#2b8caa" opacity="0.08"/>
  <circle cx="1230" cy="640" r="150" fill="#e26a3e" opacity="0.10"/>

  <!-- Eyebrow -->
  <text x="80" y="130"
        font-family="'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="22" font-weight="700"
        fill="#1d6e8b" letter-spacing="3">OPEN SOURCE · MIT · NO LOGIN</text>

  <!-- Title -->
  <text x="76" y="290"
        font-family="'Caveat', 'Comic Sans MS', cursive"
        font-size="150" font-weight="700"
        fill="#1f1c18">kiteplanet</text>

  <!-- Wind-blue divider -->
  <rect x="80" y="320" width="130" height="6" rx="3" fill="#2b8caa"/>

  <!-- Tagline (two lines) -->
  <text x="80" y="405"
        font-family="'Patrick Hand', 'Comic Sans MS', sans-serif"
        font-size="36" font-weight="400" fill="#3a352d">Trova lo spot di kitesurf giusto. Vento, onda</text>
  <text x="80" y="453"
        font-family="'Patrick Hand', 'Comic Sans MS', sans-serif"
        font-size="36" font-weight="400" fill="#3a352d">e marea da sorgenti open, su un globo interattivo.</text>

  <!-- Bottom row: stack on the left, URL on the right -->
  <text x="80" y="565"
        font-family="'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="20" fill="#6b665c">Next.js · three.js · 5 sorgenti open data · 50 spot</text>

  <text x="1200" y="565" text-anchor="end"
        font-family="'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="20" font-weight="700" fill="#1f1c18">github.com/nambaf/kiteplanet-oss</text>
</svg>
